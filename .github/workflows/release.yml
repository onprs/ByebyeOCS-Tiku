name: 发布

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 需要发布的现有版本标签
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: 检查与构建
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -p=2
    steps:
      - name: 获取源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: 设置 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
      - name: 设置 Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装前端依赖
        run: npm --prefix frontend ci --no-audit --no-fund
      - name: 构建网页
        run: npm --prefix frontend run build
      - name: 检查前端
        run: npm --prefix frontend run lint
      - name: 浏览器回归
        run: npm --prefix frontend run test:browser
      - name: 后端测试
        run: go test . ./internal/catalog ./tools/snapshot
      - name: 后端静态检查
        run: go vet . ./internal/catalog ./tools/snapshot
      - name: 构建发布文件
        run: bash scripts/build-release.sh "$RELEASE_TAG"
      - name: 验证单文件启动
        run: python3 scripts/check-release.py "dist/$RELEASE_TAG/ocs-tiku-$RELEASE_TAG-linux-amd64" "$RELEASE_TAG"
      - name: 保存发布文件
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binaries
          path: dist/${{ env.RELEASE_TAG }}/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 发布 Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 获取发布说明
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: 下载发布文件
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-binaries
          path: dist
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft \
            --title "OCS-Tiku $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          gh release edit "$RELEASE_TAG" --draft=false --latest
